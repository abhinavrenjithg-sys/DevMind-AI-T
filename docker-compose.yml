version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devmind-postgres
    environment:
      POSTGRES_USER: devmind
      POSTGRES_PASSWORD: devmind_secure_password
      POSTGRES_DB: devmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devmind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devmind-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://devmind:devmind_secure_password@postgres:5432/devmind
      - REDIS_URL=redis://redis:6379/0
      - AI_PROVIDER=heuristic
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devmind-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_storage:
